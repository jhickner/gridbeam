<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Grid Beam Editor</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <strong>Grid Beam Editor</strong>
      <span class="mode-group">
        <button id="btn-mode-orbit" class="mode-btn active" title="Orbit mode: drag empty space to orbit">Orbit</button>
        <button id="btn-mode-select" class="mode-btn" title="Select mode: drag empty space to marquee-select">Select</button>
      </span>
      <select id="add-type-select">
        <option value="beam">Beam</option>
        <option value="panel">Panel</option>
        <option value="panel:pegboard">Peg board panel</option>
        <option value="panel:pegboard-aluminum">Aluminum peg board panel</option>
        <option value="panel:pegboard-black-aluminum">Black aluminum peg board panel</option>
        <option value="panel:wood">Wood panel</option>
        <option value="seforim">Seforim row</option>
      </select>
      <button id="btn-add">+</button>
      <span class="sep"></span>
      <button id="btn-undo" title="Cmd/Ctrl+Z">Undo</button>
      <button id="btn-redo" title="Shift+Cmd/Ctrl+Z">Redo</button>
      <span class="sep"></span>
      <button id="btn-save">Save JSON</button>
      <button id="btn-load">Load JSON</button>
      <input type="file" id="file-load" accept="application/json" hidden />
      <button id="btn-export">Export Plan</button>
      <span class="sep"></span>
      <button id="btn-clear">Clear</button>
      <button id="btn-minimal" title="Drill only the holes needed for connections">Minimal Holes: off</button>
      <button id="btn-clipped" title="Remove 3/4&quot; triangle from each panel corner">Clipped Corners: off</button>
      <button id="btn-panel-opacity" title="Toggle all panels between 50% transparent and 100% opaque">Panels: 50%</button>
      <select id="env-select" title="Surrounding environment">
        <option value="none">No Environment</option>
        <option value="dome-30">30' Dome</option>
        <option value="dome-16">16' Dome</option>
      </select>
      <span id="hint">drag · R rotate · T/⇧T ±5° · A/Z up/dn · S snap to surface · [ ] / ⇧arrow resize · Del</span>
    </header>
    <div id="main">
      <div id="canvas-wrap">
        <div id="move-hud"></div>
        <div id="beam-height-labels"></div>
      </div>
      <aside id="sidebar">
        <h3>Selection</h3>
        <div id="sel-empty">Nothing selected</div>
        <div id="sel-props" hidden></div>
        <h3>Summary</h3>
        <div id="summary"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
