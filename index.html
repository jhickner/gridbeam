<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Grid Beam Editor</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <strong>Grid Beam Editor</strong>
      <button id="btn-add-beam">+ Beam</button>
      <button id="btn-add-panel">+ Panel</button>
      <span class="sep"></span>
      <button id="btn-undo" title="Cmd/Ctrl+Z">Undo</button>
      <button id="btn-redo" title="Shift+Cmd/Ctrl+Z">Redo</button>
      <span class="sep"></span>
      <button id="btn-save">Save JSON</button>
      <button id="btn-load">Load JSON</button>
      <input type="file" id="file-load" accept="application/json" hidden />
      <button id="btn-export">Export Plan</button>
      <span class="sep"></span>
      <button id="btn-clear">Clear</button>
      <button id="btn-minimal" title="Drill only the holes needed for connections">Minimal Holes: off</button>
      <span id="hint">drag: place · R: rotate · Q/E: down/up · [ / ]: shrink/grow · Del: delete</span>
    </header>
    <div id="main">
      <div id="canvas-wrap"></div>
      <aside id="sidebar">
        <h3>Selection</h3>
        <div id="sel-empty">Nothing selected</div>
        <div id="sel-props" hidden></div>
        <h3>Summary</h3>
        <div id="summary"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
